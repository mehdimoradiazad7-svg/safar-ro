<body>

  HTML

<header>
  <h1>سفر رو 🚕</h1>
  <p>سامانه درخواست تاکسی و وانت‌بار</p>
</header>

<main>
  <section class="card">
    <h2>درخواست سفر</h2>

    <label for="service">نوع وسیله نقلیه</label>
    <select id="service">
      <option value="taxi">تاکسی سواری</option>
      <option value="peikan">وانت پیکان</option>
      <option value="nissan">وانت نیسان</option>
    </select>

    <label for="origin">مبدأ سفر</label>
    <input id="origin" type="text" placeholder="آدرس مبدأ">

    <label for="destination">مقصد سفر</label>
    <input id="destination" type="text" placeholder="آدرس مقصد">

    <label for="distance">مسافت سفر (کیلومتر)</label>
    <input id="distance" type="number" min="0.1" step="0.1"
           placeholder="مثلاً 5">

    <label for="stopMinutes">مدت توقف تاکسی (دقیقه)</label>
    <input id="stopMinutes" type="number" min="0" step="1" value="0">

   HTML

<label for="passengers">تعداد مسافران</label>
<input id="passengers" type="number" min="1" step="1" value="1">

<label for="hasLuggage">آیا بار یا وسیله همراه دارید؟</label>
<select id="hasLuggage">
  <option value="no">خیر</option>
  <option value="yes">بله</option>
</select>

<label for="disability">وضعیت معلولیت یا ویلچر</label>
<select id="disability">
  <option value="none">بدون نیاز ویژه</option>
  <option value="wheelchair">همراه داشتن ویلچر</option>
  <option value="disability">مسافر دارای معلولیت</option>
</select>
    <button type="button" id="calculateButton">
      برآورد قیمت
    </button>

    <div id="result" class="note"></div>
  </section>
</main>

HTML

<script>
  const calculateButton = document.getElementById("calculateButton");

  calculateButton.addEventListener("click", function () {
    const service = document.getElementById("service").value;
    const distance = Number(document.getElementById("distance").value);
    const stopMinutes = Number(document.getElementById("stopMinutes").value);
    const result = document.getElementById("result");

    if (!Number.isFinite(distance) || distance <= 0) {
      result.textContent = "لطفاً مسافت سفر را به کیلومتر وارد کنید.";
      return;
    }

    if (!Number.isFinite(stopMinutes) || stopMinutes < 0) {
      result.textContent = "لطفاً مدت توقف را درست وارد کنید.";
      return;
    }

    let rate = 0;

    if (service === "taxi") {
      rate = 20000;
    } else if (service === "peikan") {
      rate = 100000;
    } else if (service === "nissan") {
      rate = 150000;
    }

    let total = distance * rate;

    if (service === "taxi") {
      total += Math.floor(stopMinutes / 5) * 15000;
    }

   JavaScript
}
    result.textContent =
      "هزینه برآوردی سفر: " +
      Math.round(total).toLocaleString("fa-IR") +
      " تومان";
  });
</script>
