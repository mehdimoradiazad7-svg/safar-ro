<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سفر رو</title>
  <style>
    body { margin: 0; font-family: Tahoma, Arial, sans-serif; background: #f3f7f5; color: #18352c; line-height: 1.9; }
    header { background: #116b50; color: white; text-align: center; padding: 16px; }
    main { padding: 20px; text-align: center; }
    button { padding: 12px 20px; margin: 6px; cursor: pointer; border: 0; border-radius: 8px; background: #116b50; color: white; font-family: inherit; font-size: 16px; }
    section { margin-top: 20px; padding: 12px; border-radius: 10px; background: white; }
  </style>
</head>
<body>
  <header>
    <h1>سفر رو</h1>
    <p>سامانه یکپارچه حمل‌ونقل</p>
  </header>
  <main>
    <div id="home">
      <h2>به سفر رو خوش آمدید</h2>
      <p>لطفاً نقش خود را انتخاب کنید.</p>
      <button onclick="showRole('passenger')">ورود مسافر</button>
      <button onclick="showRole('driver')">ورود راننده</button>
    </div>
    <section id="passenger" hidden>
      <h2>پنل مسافر</h2>
      <p>درخواست سفر و مشاهدهٔ خدمات</p>
      <button onclick="goHome()">بازگشت</button>
    </section>
    <section id="driver" hidden>
      <h2>پنل راننده</h2>
      <p>مدیریت درخواست‌های سفر</p>
      <button onclick="goHome()">بازگشت</button>
    </section>
  </main>
  <script>
    function showRole(role) {
      document.getElementById('home').hidden = true;
      document.getElementById('passenger').hidden = true;
      document.getElementById('driver').hidden = true;
      document.getElementById(role).hidden = false;
    }
    function goHome() {
      document.getElementById('home').hidden = false;
      document.getElementById('passenger').hidden = true;
      document.getElementById('driver').hidden = true;
    }
  </script>
</body>
</html>
