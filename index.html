HTML

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سفر رو</title>
HTML

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
    direction: rtl;
  }

  header {
    background: #087f5b;
    color: white;
    text-align: center;
    padding: 24px 12px;
  }

  header h1 {
    margin: 0 0 8px;
    font-size: 28px;
  }

  header p {
    margin: 0;
    font-size: 14px;
  }

  main {
    max-width: 600px;
    margin: 20px auto;
    padding: 12px;
  }

  .card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px #0000000d;
    margin-bottom: 16px;
  }

  h2 {
    font-size: 19px;
    margin-top: 0;
  }

  label {
    display: block;
    margin: 14px 0 7px;
    font-size: 14px;
    font-weight: bold;
  }

  input, select, button {
    width: 100%;
    padding: 12px;
    font-family: inherit;
    font-size: 15px;
    border-radius: 8px;
  }

  input, select {
    border: 1px solid #cbd5e1;
    background: white;
  }

  button {
    border: none;
    background: #087f5b;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 18px;
  }

  button:hover {
    background: #066849;
  }

  .note {
    color: #64748b;
    font-size: 12px;
    line-height: 1.8;
  }
</style>
</head>
<body>

  HTML

<header>
  <h1>سفر رو 🚕</h1>
  <p>سامانه درخواست تاکسی و وانت‌بار</p>
</header>

<main>
  <section class="card">
    <h2>درخواست سفر</h2>

    <label for="service">نوع وسیله نقلیه</label>
    <select id="service">
      <option value="taxi">تاکسی سواری</option>
      <option value="peikan">وانت پیکان</option>
      <option value="nissan">وانت نیسان</option>
    </select>

    <label for="origin">مبدأ سفر</label>
    <input id="origin" type="text" placeholder="آدرس مبدأ">

    <label for="destination">مقصد سفر</label>
    <input id="destination" type="text" placeholder="آدرس مقصد">

    <label for="distance">مسافت سفر (کیلومتر)</label>
    <input id="distance" type="number" min="0.1" step="0.1"
           placeholder="مثلاً 5">

    <label for="stopMinutes">مدت توقف تاکسی (دقیقه)</label>
    <input id="stopMinutes" type="number" min="0" step="1" value="0">

    <button type="button" id="calculateButton">
      برآورد قیمت
    </button>

    <div id="result" class="note"></div>
  </section>
</main>

</body>
</html>
