HTML

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#116b50">
  <title>سفر رو | سامانه حمل‌ونقل</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      direction: rtl;
      background: #f3f7f5;
      color: #18352c;
      line-height: 1.8;
    }
    header {
      background: #116b50;
      color: white;
      padding: 18px;
      text-align: center;
    }
    main {
      max-width: 720px;
      margin: auto;
      padding: 16px;
    }
    section {
      background: white;
      margin: 14px 0;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #18352c12;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 11px;
      margin-top: 5px;
      font: inherit;
      border: 1px solid #cbd8d1;
      border-radius: 8px;
    }
    button {
      background: #116b50;
      color: white;
      border: 0;
      cursor: pointer;
      margin-top: 12px;
    }
    .muted { color: #5a7066; font-size: .9rem; }
    .result {
      background: #edf7f1;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>سفر رو</h1>
    <p>سامانه حمل‌ونقل استان</p>
  </header>
  <main>
    <section>
      <h2>به سفر رو خوش آمدید</h2>
      <p>سامانهٔ یکپارچهٔ درخواست سفر برای رانندگان و مسافران</p>
      <div class="row">
        <button type="button">ورود مسافر</button>
        <button type="button">ورود راننده</button>
      </div>
      <p class="muted">
        ورود و ثبت‌نام واقعی در مراحل بعدی به احراز هویت امن،
        سرور و سرویس پیامک متصل خواهد شد.
      </p>
    </section>
  </main>
</body>
</html>
