<body>
<header>

HTML

<div>
  HTML

<section>
  <h3>ورود مسافر</h3>
  <label for="passengerPhone">شماره تلفن همراه</label>
  <input id="passengerPhone" type="tel" dir="ltr" placeholder="09123456789">
  <button type="button">دریافت کد تأیید</button>
  <h3>ورود راننده</h3>
  <label for="driverPhone">شماره تلفن همراه</label>
  <input id="driverPhone" type="tel" dir="ltr" placeholder="09123456789">
  <button type="button">دریافت کد تأیید</button>
</section>
  
</div>
  HTML
<section>
<h2>انتخاب نوع سفر</h2>
<label for="vehicle">وسیله نقلیه:</label>
<select id="vehicle">
<option value="sedan">سواری - کیلومتری ۲۰ هزار تومان</option>
<option value="peykan">وانت پیکان - کیلومتری ۱۰۰ هزار تومان</option>
<option value="nissan">نیسان - کیلومتری ۱۵۰ هزار تومان</option>
</select>
</section>
  HTML
<section>
<h2>برآورد کرایه</h2>
<label for="distance">مسافت سفر (کیلومتر):</label>
<input id="distance" type="number" min="1" step="0.1" placeholder="مثلاً 10">
<button type="button" onclick="calcFare()">محاسبه کرایه</button>
<p id="fareResult">مبلغ کرایه نمایش داده می‌شود.</p>
</section>
<script>
function calcFare(){
const d=Number(document.getElementById('distance').value);
const v=document.getElementById('vehicle').value;
const r={sedan:20000,peykan:100000,nissan:150000};
if(!Number.isFinite(d)||d<=0){alert('مسافت معتبر وارد کنید');return;}
document.getElementById('fareResult').textContent='کرایه تقریبی: '+(d*r[v]).toLocaleString('fa-IR')+' تومان';
}
</script>
</main>
</body>
