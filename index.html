<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سفر رو</title>
</head>
<body>

HTML

<header>
  <h1>سفر رو</h1>
  <p>سامانه یکپارچه حمل‌ونقل</p>
</header>
<main>
  <h2>به سفر رو خوش آمدید</h2>
  <p>لطفاً نقش خود را انتخاب کنید.</p>
  <button onclick="showRole('passenger')">ورود مسافر</button>
  <button onclick="showRole('driver')">ورود راننده</button>

HTML

<section id="passenger" hidden>
  <h2>بخش مسافر</h2>
  <p>به سفر رو خوش آمدید.</p>
  <button onclick="goHome()">بازگشت</button>
</section>
<section id="driver" hidden>
  <h2>بخش راننده</h2>
  <p>ورود راننده به سامانه سفر رو</p>
  <button onclick="goHome()">بازگشت</button>
HTML

</section>
</main>
<script>
function showRole(role) {
  document.getElementById('passenger').hidden = true;
  document.getElementById('driver').hidden = true;
  document.getElementById(role).hidden = false;
}
function goHome() {
  document.getElementById('passenger').hidden = true;
  document.getElementById('driver').hidden = true;
}
</script>
</body>
</html>
